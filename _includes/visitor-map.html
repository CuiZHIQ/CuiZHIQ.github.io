<!-- MapMyVisitors Visitor Map -->
<style>
  .visitor-map-frame {
    width: min(86%, 680px);
    margin: 2em auto 0;
  }

  .visitor-total-pageviews {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: center;
    gap: 0.25em 0.55em;
    margin-bottom: 0.75em;
    color: #4a4a4a;
  }

  .visitor-total-pageviews__value {
    color: #2d78ad;
    font-size: 1.2em;
    font-weight: 700;
  }

  .visitor-total-pageviews__since {
    color: #777;
    font-size: 0.82em;
  }

  .visitor-total-pageviews:hover,
  .visitor-total-pageviews:focus {
    text-decoration: none;
  }

  @media (max-width: 600px) {
    .visitor-map-frame {
      width: 94%;
    }
  }
</style>
<div class="visitor-map-frame">
  <a class="visitor-total-pageviews" href="https://mapmyvisitors.com/web/1c1pb" target="_blank" rel="noopener noreferrer" aria-label="View detailed visitor statistics">
    <span class="visitor-total-pageviews__value">{{ site.data.visitor_stats.total_pageviews | default: "1,082" }}</span>
    <span>Total Pageviews</span>
    <span class="visitor-total-pageviews__since">Since {{ site.data.visitor_stats.since | default: "Jan 7, 2026" }}</span>
  </a>
  <script type="text/javascript" id="mapmyvisitors" src="//mapmyvisitors.com/map.js?d=K8hlhn03q8PuMR3VWb3ekeedZGdmrfXN6MemOBfMpdw&cl=ffffff&w=a&t=n"></script>
</div>
