name: Update Visitor Statistics

"on":
  schedule:
    - cron: "20 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Refresh cumulative pageviews
        run: python scripts/update_visitor_stats.py
      - name: Commit updated count
        run: |
          if git diff --quiet -- _data/visitor_stats.yml; then
            echo "No visitor statistic changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/visitor_stats.yml
          git commit -m "data: update visitor pageviews"
          git pull --rebase origin main
          git push origin main
